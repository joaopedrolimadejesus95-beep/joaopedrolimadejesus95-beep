<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <style><![CDATA[
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .font-mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }

      @keyframes radarSweep {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes pulseDot {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.3; }
      }
      @keyframes floatOrb {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-5px); }
      }
      @keyframes blinkCursor {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      @keyframes scanlineMove {
        0% { transform: translateY(0px); opacity: 0.06; }
        50% { opacity: 0.16; }
        100% { transform: translateY(320px); opacity: 0.06; }
      }

      .radar-beam {
        transform-origin: 575px 160px;
        animation: radarSweep 5.5s linear infinite;
      }
      .status-dot {
        animation: pulseDot 2.2s ease-in-out infinite;
      }
      .db-orb {
        transform-origin: 575px 160px;
        animation: floatOrb 3.6s ease-in-out infinite;
      }
      .db-blip {
        animation: pulseDot 1.6s ease-in-out infinite;
      }
      .cursor-blink {
        animation: blinkCursor 1.1s step-end infinite;
      }
      .scanline {
        animation: scanlineMove 7s linear infinite;
      }
    ]]></style>

    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090B" />
      <stop offset="52%" stop-color="#0F1117" />
      <stop offset="100%" stop-color="#13111C" />
    </linearGradient>

    <radialGradient id="emeraldGlow" cx="48%" cy="50%" r="42%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.14" />
      <stop offset="60%" stop-color="#059669" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="amberGlow" cx="85%" cy="25%" r="40%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.13" />
      <stop offset="65%" stop-color="#EA580C" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Dragon Ball 4-Star Sphere Gradient -->
    <radialGradient id="dragonSphere" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="35%" stop-color="#F59E0B" />
      <stop offset="80%" stop-color="#EA580C" />
      <stop offset="100%" stop-color="#9A3412" />
    </radialGradient>

    <!-- Radar Sweep Cone -->
    <linearGradient id="radarCone" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.38" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.0" />
    </linearGradient>

    <!-- Subtle Dot Grid Pattern -->
    <pattern id="dotGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#FFFFFF" fill-opacity="0.055" />
    </pattern>

    <!-- Dragon Radar Grid Pattern -->
    <pattern id="radarGrid" width="22" height="22" patternUnits="userSpaceOnUse">
      <path d="M 22 0 L 0 0 0 22" fill="none" stroke="#10B981" stroke-width="0.6" stroke-opacity="0.16" />
    </pattern>

    <!-- Reusable 5-Point Star -->
    <polygon id="redStar" points="0,-4.2 1.2,-1.3 4.3,-1.3 1.8,0.6 2.7,3.6 0,1.8 -2.7,3.6 -1.8,0.6 -4.3,-1.3 -1.2,-1.3" fill="#DC2626" />
  </defs>

  <!-- Main Card Frame -->
  <rect width="1200" height="320" rx="18" fill="url(#bgGrad)" />
  <rect width="1200" height="320" rx="18" fill="url(#dotGrid)" />
  <rect width="1200" height="320" rx="18" fill="url(#emeraldGlow)" />
  <rect width="1200" height="320" rx="18" fill="url(#amberGlow)" />

  <!-- Subtle Horizontal Scouter Scanline -->
  <rect class="scanline" x="0" y="0" width="1200" height="2" fill="#10B981">
    <animate attributeName="y" values="0;320;0" dur="8s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.06;0.18;0.06" dur="8s" repeatCount="indefinite" />
  </rect>

  <!-- Outer Border -->
  <rect x="1" y="1" width="1198" height="318" rx="17" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1.5" />

  <!-- ========================================================= -->
  <!-- CENTERPIECE: DRAGON RADAR + 4-STAR ORB HUD (EASTER EGG)    -->
  <!-- ========================================================= -->
  <g opacity="0.95">
    <!-- Outer Telemetry Ring -->
    <circle cx="575" cy="160" r="108" fill="#070B0E" fill-opacity="0.7" stroke="#10B981" stroke-opacity="0.22" stroke-width="1.2" />
    <circle cx="575" cy="160" r="98" fill="url(#radarGrid)" stroke="#10B981" stroke-opacity="0.3" stroke-width="1" stroke-dasharray="6 4" />
    <circle cx="575" cy="160" r="68" fill="none" stroke="#10B981" stroke-opacity="0.18" stroke-width="1" />
    <circle cx="575" cy="160" r="38" fill="none" stroke="#10B981" stroke-opacity="0.18" stroke-width="1" />

    <!-- Radar Crosshairs -->
    <line x1="467" y1="160" x2="683" y2="160" stroke="#10B981" stroke-opacity="0.2" stroke-width="1" />
    <line x1="575" y1="52" x2="575" y2="268" stroke="#10B981" stroke-opacity="0.2" stroke-width="1" />

    <!-- Rotating Radar Sweep (Both CSS and SMIL animateTransform for 100% GitHub compatibility) -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 575 160" to="360 575 160" dur="5.5s" repeatCount="indefinite" />
      <path d="M 575 160 L 575 62 A 98 98 0 0 1 658 108 Z" fill="url(#radarCone)" />
      <line x1="575" y1="160" x2="575" y2="62" stroke="#34D399" stroke-opacity="0.8" stroke-width="1.8" />
    </g>

    <!-- Radar Blips (Dragon Balls detected on radar!) -->
    <circle class="db-blip" cx="532" cy="112" r="3.5" fill="#FBBF24">
      <animate attributeName="opacity" values="1;0.25;1" dur="1.6s" repeatCount="indefinite" />
    </circle>
    <circle class="db-blip" cx="622" cy="105" r="3" fill="#FBBF24">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1.9s" repeatCount="indefinite" />
    </circle>
    <circle class="db-blip" cx="638" cy="182" r="3.5" fill="#FBBF24">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.4s" repeatCount="indefinite" />
    </circle>
    <circle class="db-blip" cx="518" cy="198" r="3" fill="#FBBF24">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2.1s" repeatCount="indefinite" />
    </circle>
    <circle class="db-blip" cx="555" cy="228" r="3" fill="#FBBF24">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.7s" repeatCount="indefinite" />
    </circle>
    <circle class="db-blip" cx="605" cy="215" r="3" fill="#FBBF24">
      <animate attributeName="opacity" values="0.25;1;0.25" dur="1.5s" repeatCount="indefinite" />
    </circle>

    <!-- Center 4-Star Dragon Ball (Suu Xing Qiu) -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,-5; 0,0" dur="3.4s" repeatCount="indefinite" />
      <circle cx="575" cy="160" r="26" fill="url(#dragonSphere)" stroke="#FDE047" stroke-opacity="0.65" stroke-width="1.2" />
      <!-- Glass reflection highlight -->
      <ellipse cx="566" cy="149" rx="9" ry="5" transform="rotate(-25 566 149)" fill="#FFFFFF" fill-opacity="0.45" />
      <!-- 4 Stars inside the Orb -->
      <use href="#redStar" x="568" y="153" />
      <use href="#redStar" x="582" y="153" />
      <use href="#redStar" x="568" y="167" />
      <use href="#redStar" x="582" y="167" />
    </g>

    <!-- Scouter Telemetry Tag under Radar -->
    <rect x="503" y="276" width="144" height="22" rx="6" fill="#090D16" stroke="#10B981" stroke-opacity="0.3" stroke-width="1" />
    <text x="575" y="291" text-anchor="middle" fill="#34D399" class="font-mono" font-size="10" font-weight="600" letter-spacing="1.2">CAPSULE.CORP // v4</text>
  </g>

  <!-- ========================================================= -->
  <!-- LEFT COLUMN: IDENTITY & TARGET POSITIONING                 -->
  <!-- ========================================================= -->
  <g transform="translate(56, 0)">
    <!-- Top Capsule Badge -->
    <rect x="0" y="44" width="218" height="26" rx="6" fill="#18181B" stroke="#F59E0B" stroke-opacity="0.35" stroke-width="1" />
    <circle cx="14" cy="57" r="4" fill="#F59E0B" />
    <text x="26" y="61" fill="#FBBF24" class="font-mono" font-size="11" font-weight="600" letter-spacing="1.1">BACKEND &amp; AI ENGINEER</text>

    <!-- Main Name -->
    <text x="0" y="128" fill="#FAFAFA" class="font-sans" font-size="50" font-weight="800" letter-spacing="-1.2">João Pedro</text>

    <!-- Subtitle / University -->
    <text x="0" y="162" fill="#A1A1AA" class="font-sans" font-size="16.5" font-weight="500">
      Ciência da Computação · <tspan fill="#E4E4E7" font-weight="600">UTFPR</tspan>
    </text>

    <!-- Stack Pill Row -->
    <g transform="translate(0, 186)" class="font-mono" font-size="11.5" font-weight="600">
      <rect x="0" y="0" width="72" height="26" rx="6" fill="#121215" stroke="#27272A" stroke-width="1" />
      <text x="36" y="17" text-anchor="middle" fill="#34D399">Node.js</text>

      <rect x="80" y="0" width="92" height="26" rx="6" fill="#121215" stroke="#27272A" stroke-width="1" />
      <text x="126" y="17" text-anchor="middle" fill="#60A5FA">TypeScript</text>

      <rect x="180" y="0" width="92" height="26" rx="6" fill="#121215" stroke="#27272A" stroke-width="1" />
      <text x="226" y="17" text-anchor="middle" fill="#A78BFA">PostgreSQL</text>

      <rect x="280" y="0" width="68" height="26" rx="6" fill="#121215" stroke="#27272A" stroke-width="1" />
      <text x="314" y="17" text-anchor="middle" fill="#38BDF8">Docker</text>

      <rect x="356" y="0" width="44" height="26" rx="6" fill="#121215" stroke="#F59E0B" stroke-opacity="0.4" stroke-width="1" />
      <text x="378" y="17" text-anchor="middle" fill="#FBBF24">IA</text>
    </g>

    <!-- Status Badge (Live Pulse) -->
    <g transform="translate(0, 236)">
      <rect x="0" y="0" width="286" height="36" rx="18" fill="#091914" stroke="#10B981" stroke-opacity="0.4" stroke-width="1.2" />
      <circle cx="20" cy="18" r="4.5" fill="#10B981">
        <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
        <animate attributeName="r" values="4.5;6.5;4.5" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="35" y="23" fill="#D1FAE5" class="font-sans" font-size="13.5" font-weight="600">Aberto a estágio / Jr em Backend</text>
    </g>
  </g>

  <!-- ========================================================= -->
  <!-- RIGHT COLUMN: DEVTOOLS TERMINAL + SCOUTER TELEMETRY        -->
  <!-- ========================================================= -->
  <g transform="translate(715, 36)">
    <!-- Terminal Window Container -->
    <rect x="0" y="0" width="435" height="248" rx="12" fill="#090D16" fill-opacity="0.92" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="1.2" />

    <!-- Terminal Header Bar -->
    <path d="M 0 12 A 12 12 0 0 1 12 0 L 423 0 A 12 12 0 0 1 435 12 L 435 36 L 0 36 Z" fill="#12151E" />
    <line x1="0" y1="36" x2="435" y2="36" stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="1" />

    <!-- macOS / DevTools Window Dots -->
    <circle cx="18" cy="18" r="5" fill="#EF4444" fill-opacity="0.85" />
    <circle cx="34" cy="18" r="5" fill="#F59E0B" fill-opacity="0.85" />
    <circle cx="50" cy="18" r="5" fill="#10B981" fill-opacity="0.85" />

    <!-- Terminal Title -->
    <text x="217" y="22" text-anchor="middle" fill="#71717A" class="font-mono" font-size="11" font-weight="500">scouter://joao-pedro.ts</text>

    <!-- Power Level Badge inside Header -->
    <rect x="338" y="8" width="84" height="20" rx="4" fill="#1C1917" stroke="#F59E0B" stroke-opacity="0.4" stroke-width="0.8" />
    <text x="380" y="21" text-anchor="middle" fill="#FBBF24" class="font-mono" font-size="9.5" font-weight="700">KI: 8000+</text>

    <!-- Code Content -->
    <g transform="translate(22, 64)" class="font-mono" font-size="12.5" font-weight="500">
      <text x="0" y="0">
        <tspan fill="#F472B6">const</tspan>
        <tspan fill="#FAFAFA"> joao </tspan>
        <tspan fill="#F472B6">=</tspan>
        <tspan fill="#A1A1AA"> {</tspan>
      </text>

      <text x="18" y="26">
        <tspan fill="#93C5FD">foco</tspan><tspan fill="#A1A1AA">: </tspan>
        <tspan fill="#34D399">"Backend, Arquitetura &amp; IA"</tspan><tspan fill="#A1A1AA">,</tspan>
      </text>

      <text x="18" y="52">
        <tspan fill="#93C5FD">stack</tspan><tspan fill="#A1A1AA">: [</tspan>
        <tspan fill="#FDE047">"Node.js"</tspan><tspan fill="#A1A1AA">, </tspan>
        <tspan fill="#FDE047">"TS"</tspan><tspan fill="#A1A1AA">, </tspan>
        <tspan fill="#FDE047">"Postgres"</tspan><tspan fill="#A1A1AA">, </tspan>
        <tspan fill="#FDE047">"Docker"</tspan><tspan fill="#A1A1AA">],</tspan>
      </text>

      <text x="18" y="78">
        <tspan fill="#93C5FD">explorando</tspan><tspan fill="#A1A1AA">: [</tspan>
        <tspan fill="#FDBA74">"AWS"</tspan><tspan fill="#A1A1AA">, </tspan>
        <tspan fill="#FDBA74">"LLMs"</tspan><tspan fill="#A1A1AA">, </tspan>
        <tspan fill="#FDBA74">"n8n"</tspan><tspan fill="#A1A1AA">, </tspan>
        <tspan fill="#FDBA74">"Postman"</tspan><tspan fill="#A1A1AA">],</tspan>
      </text>

      <text x="18" y="104">
        <tspan fill="#93C5FD">treino</tspan><tspan fill="#A1A1AA">: </tspan>
        <tspan fill="#C084FC">"GravityRoom(100x)"</tspan><tspan fill="#A1A1AA">, </tspan>
        <tspan fill="#52525B">// UTFPR + SaaS</tspan>
      </text>

      <text x="18" y="130">
        <tspan fill="#93C5FD">status</tspan><tspan fill="#A1A1AA">: </tspan>
        <tspan fill="#34D399">"Pronto para produção"</tspan>
      </text>

      <text x="0" y="156">
        <tspan fill="#A1A1AA">};</tspan>
      </text>

      <!-- Active Prompt Line with Blinking Cursor -->
      <text x="0" y="176" font-size="11.5">
        <tspan fill="#10B981">➜</tspan>
        <tspan fill="#38BDF8"> ~/capsule-corp</tspan>
        <tspan fill="#A1A1AA"> $ npm run deploy --production</tspan>
      </text>
      <rect class="cursor-blink" x="288" y="165" width="7" height="14" fill="#10B981">
        <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite" />
      </rect>
    </g>
  </g>
</svg>
