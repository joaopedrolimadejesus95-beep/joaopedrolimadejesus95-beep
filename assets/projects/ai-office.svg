<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 330" width="100%" height="100%">
  <defs>
    <style><![CDATA[
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .font-mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Monaco, Consolas, monospace; }
    ]]></style>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090A14" />
      <stop offset="100%" stop-color="#130E24" />
    </linearGradient>
    <radialGradient id="artGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#C084FC" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <pattern id="cardDots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.8" fill="#FFFFFF" fill-opacity="0.05" />
    </pattern>
  </defs>

  <!-- Outer Card -->
  <rect width="560" height="330" rx="16" fill="url(#cardBg)" />
  <rect x="1" y="1" width="558" height="328" rx="15" fill="none" stroke="#C084FC" stroke-opacity="0.32" stroke-width="1.3" />

  <!-- Top Illustrated Header Window -->
  <rect x="14" y="14" width="532" height="122" rx="12" fill="#0D0C1D" stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="1" />
  <rect x="14" y="14" width="532" height="122" rx="12" fill="url(#cardDots)" />
  <rect x="14" y="14" width="532" height="122" rx="12" fill="url(#artGlow)" />

  <!-- Subtle Horizon / City Silhouette inside Header -->
  <path d="M 14 114 L 70 98 L 130 110 L 210 92 L 290 108 L 380 94 L 465 106 L 546 96 L 546 136 L 14 136 Z" fill="#17122E" opacity="0.7" />

  <!-- Project Index Tag + Number Circle -->
  <rect x="26" y="24" width="102" height="22" rx="6" fill="#0A0A14" fill-opacity="0.85" stroke="#C084FC" stroke-opacity="0.45" stroke-width="1" />
  <text x="77" y="38.5" text-anchor="middle" fill="#E9D5FF" class="font-mono" font-size="10" font-weight="700">PROJECT // 04</text>

  <circle cx="520" cy="36" r="14" fill="#1A1230" stroke="#C084FC" stroke-opacity="0.55" stroke-width="1.2" />
  <text x="520" y="40.5" text-anchor="middle" fill="#FBCFE8" class="font-mono" font-size="12" font-weight="700">4</text>

  <!-- Custom Project Mini-Illustration -->
  <g transform="translate(205, 28)">
    <!-- 3D DAG Nodes -->
    <line x1="36" y1="45" x2="76" y2="26" stroke="#C084FC" stroke-width="1.5" />
    <line x1="36" y1="45" x2="76" y2="64" stroke="#C084FC" stroke-width="1.5" />
    <line x1="76" y1="26" x2="118" y2="45" stroke="#F472B6" stroke-width="1.5" />
    <line x1="76" y1="64" x2="118" y2="45" stroke="#F472B6" stroke-width="1.5" />
    <circle cx="36" cy="45" r="13" fill="#1D1238" stroke="#C084FC" stroke-width="1.6" />
    <circle cx="76" cy="26" r="12" fill="#1D1238" stroke="#A78BFA" stroke-width="1.6" />
    <circle cx="76" cy="64" r="12" fill="#1D1238" stroke="#A78BFA" stroke-width="1.6" />
    <circle cx="118" cy="45" r="14" fill="#2A1138" stroke="#F472B6" stroke-width="1.8" />
    <text x="36" y="48.5" text-anchor="middle" fill="#E9D5FF" class="font-mono" font-size="9">IN</text>
    <text x="118" y="48.5" text-anchor="middle" fill="#FBCFE8" class="font-mono" font-size="9">DAG</text>
  </g>

  <!-- Title & Subtitle -->
  <text x="24" y="168" fill="#FAFAFA" class="font-sans" font-size="21" font-weight="800" letter-spacing="-0.3">AI Office Studio</text>
  <text x="24" y="187" fill="#C084FC" class="font-mono" font-size="11" font-weight="600" letter-spacing="0.4">ORQUESTRAÇÃO MULTIAGENTE · CENA 3D &amp; APPSEC</text>

  <!-- 2-Line Description -->
  <text x="24" y="210" fill="#CBD5E1" class="font-sans" font-size="12.8">Escritório 3D com 6 agentes executando planos em DAG, validação Zod,</text>
  <text x="24" y="228" fill="#CBD5E1" class="font-sans" font-size="12.8">AES-256-GCM, scrypt, anti-SSRF e sincronização via Socket.io.</text>

  <!-- Stack Pills -->
  <rect x="24" y="242" width="90" height="22" rx="6" fill="#141129" stroke="#C084FC" stroke-opacity="0.38" stroke-width="1" />
  <text x="69.0" y="256.5" text-anchor="middle" fill="#E2E8F0" class="font-mono" font-size="10.5" font-weight="600">TypeScript</text>
  <rect x="122.0" y="242" width="76" height="22" rx="6" fill="#141129" stroke="#C084FC" stroke-opacity="0.38" stroke-width="1" />
  <text x="159.8" y="256.5" text-anchor="middle" fill="#E2E8F0" class="font-mono" font-size="10.5" font-weight="600">Three.js</text>
  <rect x="205.6" y="242" width="83" height="22" rx="6" fill="#141129" stroke="#C084FC" stroke-opacity="0.38" stroke-width="1" />
  <text x="247.0" y="256.5" text-anchor="middle" fill="#E2E8F0" class="font-mono" font-size="10.5" font-weight="600">Socket.io</text>
  <rect x="296.4" y="242" width="56" height="22" rx="6" fill="#141129" stroke="#C084FC" stroke-opacity="0.38" stroke-width="1" />
  <text x="324.4" y="256.5" text-anchor="middle" fill="#E2E8F0" class="font-mono" font-size="10.5" font-weight="600">Zod</text>
  <rect x="360.4" y="242" width="90" height="22" rx="6" fill="#141129" stroke="#C084FC" stroke-opacity="0.38" stroke-width="1" />
  <text x="405.4" y="256.5" text-anchor="middle" fill="#E2E8F0" class="font-mono" font-size="10.5" font-weight="600">PostgreSQL</text>

  <!-- CTA Button -->
  <g transform="translate(24, 280)">
    <rect x="0" y="0" width="154" height="32" rx="9" fill="#C084FC" fill-opacity="0.18" stroke="#C084FC" stroke-opacity="0.65" stroke-width="1.2" />
    <text x="77" y="20" text-anchor="middle" fill="#FAFAFA" class="font-sans" font-size="12.5" font-weight="700">Ver repositório →</text>
  </g>

  <!-- Subtle Pixel Cat Paw Watermark on Bottom Right -->
  <g transform="translate(508, 286)" fill="#C084FC" fill-opacity="0.35">
    <circle cx="10" cy="12" r="5" />
    <circle cx="4" cy="5" r="2.2" />
    <circle cx="10" cy="3" r="2.2" />
    <circle cx="16" cy="5" r="2.2" />
  </g>
</svg>
