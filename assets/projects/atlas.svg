<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 330" width="100%" height="100%">
  <defs>
    <style><![CDATA[
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .font-mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Monaco, Consolas, monospace; }
    ]]></style>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0618" />
      <stop offset="100%" stop-color="#170B2E" />
    </linearGradient>
    <linearGradient id="headerSky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140A29" />
      <stop offset="100%" stop-color="#27124C" />
    </linearGradient>
    <radialGradient id="artGlow" cx="50%" cy="48%" r="55%">
      <stop offset="0%" stop-color="#F472B6" stop-opacity="0.24" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="btnGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>
  </defs>

  <!-- Outer Card -->
  <rect width="560" height="330" rx="16" fill="url(#cardBg)" />
  <rect x="1" y="1" width="558" height="328" rx="15" fill="none" stroke="#9333EA" stroke-opacity="0.42" stroke-width="1.4" />

  <!-- Top Illustrated Header Window (matching saimumfahad-dev purple moonlit skyline) -->
  <rect x="14" y="14" width="532" height="122" rx="12" fill="url(#headerSky)" stroke="#A855F7" stroke-opacity="0.22" stroke-width="1" />
  <rect x="14" y="14" width="532" height="122" rx="12" fill="url(#artGlow)" />

  <!-- Stars & Purple Haze inside Card Header -->
  <circle cx="150" cy="34" r="1.1" fill="#FFFFFF" fill-opacity="0.7" />
  <circle cx="380" cy="28" r="1.2" fill="#F3E8FF" fill-opacity="0.65" />
  <circle cx="430" cy="54" r="1" fill="#FBCFE8" fill-opacity="0.7" />
  <ellipse cx="280" cy="126" rx="220" ry="26" fill="#7E22CE" fill-opacity="0.28" />

  <!-- Mini City Silhouette at Bottom of Header -->
  <path d="M 14 136 L 14 114 L 46 114 L 46 102 L 82 102 L 82 118 L 122 118 L 122 106 L 160 106 L 160 122 L 405 122 L 405 104 L 444 104 L 444 114 L 486 114 L 486 98 L 522 98 L 522 112 L 546 112 L 546 136 Z" fill="#0B0618" fill-opacity="0.82" />

  <!-- Project Index Tag + Number Circle -->
  <rect x="26" y="24" width="102" height="22" rx="6" fill="#0B0618" fill-opacity="0.88" stroke="#A855F7" stroke-opacity="0.5" stroke-width="1" />
  <text x="77" y="38.5" text-anchor="middle" fill="#E9D5FF" class="font-mono" font-size="10" font-weight="700">PROJECT // 02</text>

  <circle cx="520" cy="36" r="14" fill="#21103F" stroke="#C084FC" stroke-opacity="0.6" stroke-width="1.2" />
  <text x="520" y="40.5" text-anchor="middle" fill="#F3E8FF" class="font-mono" font-size="12" font-weight="700">2</text>

  <!-- Custom Project Mini-Illustration -->
  <g transform="translate(222, 24)">
    <circle cx="58" cy="48" r="38" fill="#190B2E" stroke="#F472B6" stroke-opacity="0.5" stroke-width="1.5" />
    <circle cx="58" cy="48" r="24" fill="none" stroke="#C084FC" stroke-opacity="0.35" stroke-dasharray="4 3" />
    <line x1="20" y1="48" x2="96" y2="48" stroke="#C084FC" stroke-opacity="0.25" />
    <line x1="58" y1="10" x2="58" y2="86" stroke="#C084FC" stroke-opacity="0.25" />
    <path d="M 58 26 L 76 34 L 76 52 C 76 64 58 72 58 72 C 58 72 40 64 40 52 L 40 34 Z" fill="#F472B6" fill-opacity="0.25" stroke="#FBCFE8" stroke-width="1.6" />
    <text x="58" y="53" text-anchor="middle" fill="#FAFAFA" class="font-mono" font-size="10.5" font-weight="700">16/16</text>
  </g>

  <!-- Title & Subtitle -->
  <text x="24" y="168" fill="#FAFAFA" class="font-sans" font-size="21" font-weight="800" letter-spacing="-0.3">ATLAS (v2)</text>
  <text x="24" y="187" fill="#C084FC" class="font-mono" font-size="10.8" font-weight="600" letter-spacing="0.4">AI RED TEAM &amp; APPSEC · 16 SONDAS · GROUND TRUTH SQL</text>

  <!-- 2-Line Description -->
  <text x="24" y="210" fill="#CBD5E1" class="font-sans" font-size="12.8">Framework de Red Team automatizado para SaaS e Agentes de IA com</text>
  <text x="24" y="228" fill="#CBD5E1" class="font-sans" font-size="12.8">3 baterias (IDOR, XSS, Prompt Injection) e 58 testes em CI/CD.</text>

  <!-- Stack Pills -->
  <rect x="24" y="242" width="68" height="22" rx="6" fill="#170C2E" stroke="#A855F7" stroke-opacity="0.4" stroke-width="1" />
  <text x="58.2" y="256.5" text-anchor="middle" fill="#E9D5FF" class="font-mono" font-size="10.5" font-weight="600">Node.js</text>
  <rect x="100.4" y="242" width="90" height="22" rx="6" fill="#170C2E" stroke="#A855F7" stroke-opacity="0.4" stroke-width="1" />
  <text x="145.4" y="256.5" text-anchor="middle" fill="#E9D5FF" class="font-mono" font-size="10.5" font-weight="600">PostgreSQL</text>
  <rect x="198.4" y="242" width="56" height="22" rx="6" fill="#170C2E" stroke="#A855F7" stroke-opacity="0.4" stroke-width="1" />
  <text x="226.4" y="256.5" text-anchor="middle" fill="#E9D5FF" class="font-mono" font-size="10.5" font-weight="600">OWASP</text>
  <rect x="262.4" y="242" width="97" height="22" rx="6" fill="#170C2E" stroke="#A855F7" stroke-opacity="0.4" stroke-width="1" />
  <text x="311.0" y="256.5" text-anchor="middle" fill="#E9D5FF" class="font-mono" font-size="10.5" font-weight="600">AI Security</text>
  <rect x="367.59999999999997" y="242" width="56" height="22" rx="6" fill="#170C2E" stroke="#A855F7" stroke-opacity="0.4" stroke-width="1" />
  <text x="395.6" y="256.5" text-anchor="middle" fill="#E9D5FF" class="font-mono" font-size="10.5" font-weight="600">CI/CD</text>

  <!-- CTA Button (matching saimumfahad-dev purple pill button) -->
  <g transform="translate(24, 280)">
    <rect x="0" y="0" width="160" height="32" rx="9" fill="url(#btnGrad)" />
    <text x="80" y="20" text-anchor="middle" fill="#FFFFFF" class="font-sans" font-size="12.5" font-weight="700">Ver repositório →</text>
  </g>
</svg>
