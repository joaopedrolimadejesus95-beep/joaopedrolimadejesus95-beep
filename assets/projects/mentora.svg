<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 330" width="100%" height="100%">
  <defs>
    <style><![CDATA[
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .font-mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Monaco, Consolas, monospace; }
    ]]></style>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090A14" />
      <stop offset="100%" stop-color="#130E24" />
    </linearGradient>
    <radialGradient id="artGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FB7185" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <pattern id="cardDots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.8" fill="#FFFFFF" fill-opacity="0.05" />
    </pattern>
  </defs>

  <!-- Outer Card -->
  <rect width="560" height="330" rx="16" fill="url(#cardBg)" />
  <rect x="1" y="1" width="558" height="328" rx="15" fill="none" stroke="#FB7185" stroke-opacity="0.32" stroke-width="1.3" />

  <!-- Top Illustrated Header Window -->
  <rect x="14" y="14" width="532" height="122" rx="12" fill="#0D0C1D" stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="1" />
  <rect x="14" y="14" width="532" height="122" rx="12" fill="url(#cardDots)" />
  <rect x="14" y="14" width="532" height="122" rx="12" fill="url(#artGlow)" />

  <!-- Subtle Horizon / City Silhouette inside Header -->
  <path d="M 14 114 L 70 98 L 130 110 L 210 92 L 290 108 L 380 94 L 465 106 L 546 96 L 546 136 L 14 136 Z" fill="#17122E" opacity="0.7" />

  <!-- Project Index Tag + Number Circle -->
  <rect x="26" y="24" width="102" height="22" rx="6" fill="#0A0A14" fill-opacity="0.85" stroke="#FB7185" stroke-opacity="0.45" stroke-width="1" />
  <text x="77" y="38.5" text-anchor="middle" fill="#E9D5FF" class="font-mono" font-size="10" font-weight="700">PROJECT // 06</text>

  <circle cx="520" cy="36" r="14" fill="#1A1230" stroke="#FB7185" stroke-opacity="0.55" stroke-width="1.2" />
  <text x="520" y="40.5" text-anchor="middle" fill="#FBCFE8" class="font-mono" font-size="12" font-weight="700">6</text>

  <!-- Custom Project Mini-Illustration -->
  <g transform="translate(215, 28)">
    <!-- Streak Flame & XP Progress -->
    <rect x="12" y="16" width="108" height="58" rx="10" fill="#1B0F1E" stroke="#FB7185" stroke-opacity="0.5" stroke-width="1.4" />
    <text x="66" y="40" text-anchor="middle" fill="#FDA4AF" class="font-mono" font-size="11" font-weight="700">STREAK // XP</text>
    <rect x="26" y="50" width="80" height="8" rx="4" fill="#2D162C" />
    <rect x="26" y="50" width="58" height="8" rx="4" fill="#FB7185" />
  </g>

  <!-- Title & Subtitle -->
  <text x="24" y="168" fill="#FAFAFA" class="font-sans" font-size="21" font-weight="800" letter-spacing="-0.3">Mentora</text>
  <text x="24" y="187" fill="#FB7185" class="font-mono" font-size="11" font-weight="600" letter-spacing="0.4">BACKEND JAVA 21 · SPRING BOOT &amp; POSTGRESQL</text>

  <!-- 2-Line Description -->
  <text x="24" y="210" fill="#CBD5E1" class="font-sans" font-size="12.8">API e protótipo de hábitos e estudos com cálculo de streak e XP em</text>
  <text x="24" y="228" fill="#CBD5E1" class="font-sans" font-size="12.8">histórico transacional (SQL puro via JDBC: Controller → Service → DAO).</text>

  <!-- Stack Pills -->
  <rect x="24" y="242" width="68" height="22" rx="6" fill="#141129" stroke="#FB7185" stroke-opacity="0.38" stroke-width="1" />
  <text x="58.2" y="256.5" text-anchor="middle" fill="#E2E8F0" class="font-mono" font-size="10.5" font-weight="600">Java 21</text>
  <rect x="100.4" y="242" width="97" height="22" rx="6" fill="#141129" stroke="#FB7185" stroke-opacity="0.38" stroke-width="1" />
  <text x="149.0" y="256.5" text-anchor="middle" fill="#E2E8F0" class="font-mono" font-size="10.5" font-weight="600">Spring Boot</text>
  <rect x="205.60000000000002" y="242" width="90" height="22" rx="6" fill="#141129" stroke="#FB7185" stroke-opacity="0.38" stroke-width="1" />
  <text x="250.6" y="256.5" text-anchor="middle" fill="#E2E8F0" class="font-mono" font-size="10.5" font-weight="600">PostgreSQL</text>
  <rect x="303.6" y="242" width="56" height="22" rx="6" fill="#141129" stroke="#FB7185" stroke-opacity="0.38" stroke-width="1" />
  <text x="331.6" y="256.5" text-anchor="middle" fill="#E2E8F0" class="font-mono" font-size="10.5" font-weight="600">JDBC</text>
  <rect x="367.6" y="242" width="76" height="22" rx="6" fill="#141129" stroke="#FB7185" stroke-opacity="0.38" stroke-width="1" />
  <text x="405.4" y="256.5" text-anchor="middle" fill="#E2E8F0" class="font-mono" font-size="10.5" font-weight="600">REST API</text>

  <!-- CTA Button -->
  <g transform="translate(24, 280)">
    <rect x="0" y="0" width="154" height="32" rx="9" fill="#FB7185" fill-opacity="0.18" stroke="#FB7185" stroke-opacity="0.65" stroke-width="1.2" />
    <text x="77" y="20" text-anchor="middle" fill="#FAFAFA" class="font-sans" font-size="12.5" font-weight="700">Ver repositório →</text>
  </g>

  <!-- Subtle Pixel Cat Paw Watermark on Bottom Right -->
  <g transform="translate(508, 286)" fill="#FB7185" fill-opacity="0.35">
    <circle cx="10" cy="12" r="5" />
    <circle cx="4" cy="5" r="2.2" />
    <circle cx="10" cy="3" r="2.2" />
    <circle cx="16" cy="5" r="2.2" />
  </g>
</svg>
