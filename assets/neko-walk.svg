          <path d="M 51 40 L 53 55 Q 53 58 58 58 L 59 56 L 55 40 Z" fill="#06040C" stroke="#7E22CE" stroke-width="1.2" stroke-linejoin="round" />
        </g>

        <!-- Torso + Tail + Head (subtle walking bob) -->
