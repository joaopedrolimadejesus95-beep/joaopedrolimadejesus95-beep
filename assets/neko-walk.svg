  <g transform="translate(0, 24)">
    <g>
      <animateTransform attributeName="transform" type="translate" from="-95 0" to="1240 0" dur="14s" begin="-4s" repeatCount="indefinite" />
      <g transform="scale(0.88)">
        <!-- Soft moonlight shadow beneath paws -->
        <ellipse cx="42" cy="58" rx="23" ry="3.2" fill="#000000" fill-opacity="0.55" />

        <!-- Delicate glowing sakura petal / firefly bobbing ahead of the cat -->
        <g>
          <animateTransform attributeName="transform" type="translate" values="0,0; 3,-4; 0,-1; -2,-5; 0,0" dur="1.9s" repeatCount="indefinite" />
          <circle cx="92" cy="24" r="4.5" fill="#F472B6" fill-opacity="0.28" />
          <ellipse cx="92" cy="24" rx="2.8" ry="1.6" transform="rotate(-25 92 24)" fill="#F9A8D4" />
        </g>

        <!-- Back-far leg (behind body) -->
        <g opacity="0.78">
          <animateTransform attributeName="transform" type="rotate" values="-20 24 41; 20 24 41; -20 24 41" dur="0.72s" repeatCount="indefinite" />
          <path d="M 22 40 L 18 55 Q 18 58 23 58 L 25 56 L 26 41 Z" fill="#06040C" stroke="#7E22CE" stroke-width="1.2" stroke-linejoin="round" />
        </g>

        <!-- Front-far leg (behind body) -->
