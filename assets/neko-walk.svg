          <animateTransform attributeName="transform" type="translate" values="0,0; 0,-1.6; 0,0" dur="0.36s" repeatCount="indefinite" />

          <!-- Gracefully swishing S-curved tail (outer glow stroke + inner black fill) -->
          <g>
            <animateTransform attributeName="transform" type="rotate" values="-10 21 35; 12 21 35; -10 21 35" dur="1.44s" repeatCount="indefinite" />
            <path d="M 21 35 C 11 33, 5 23, 9 13 C 11 7, 16 6, 18 9" fill="none" stroke="#A855F7" stroke-opacity="0.85" stroke-width="6.4" stroke-linecap="round" />
            <path d="M 21 35 C 11 33, 5 23, 9 13 C 11 7, 16 6, 18 9" fill="none" stroke="#080610" stroke-width="4.2" stroke-linecap="round" />
          </g>

          <!-- Sleek feline body -->
