          <!-- Back-near leg -->
          <g>
            <animateTransform attributeName="transform" type="rotate" values="20 27 41; -20 27 41; 20 27 41" dur="0.72s" repeatCount="indefinite" />
            <path d="M 25 40 L 23 55 Q 23 58 28 58 L 30 56 L 29 40 Z" fill="#080610" stroke="#A855F7" stroke-opacity="0.85" stroke-width="1.3" stroke-linejoin="round" />
          </g>

          <!-- Front-near leg -->
          <g>
            <animateTransform attributeName="transform" type="rotate" values="-20 55 41; 20 55 41; -20 55 41" dur="0.72s" repeatCount="indefinite" />
            <path d="M 53 40 L 55 55 Q 55 58 60 58 L 61 56 L 57 40 Z" fill="#080610" stroke="#A855F7" stroke-opacity="0.85" stroke-width="1.3" stroke-linejoin="round" />
          </g>

          <!-- Sakura pink collar + tiny golden bell -->
          <path d="M 55 31 Q 60 33 63 31" fill="none" stroke="#F472B6" stroke-width="2.2" stroke-linecap="round" />
          <circle cx="62.5" cy="34" r="2.1" fill="#FDE047" />

          <!-- Head + Pointy Ears -->
          <g>
            <!-- Back ear -->
            <path d="M 55 16 L 53 4 L 62 13 Z" fill="#080610" stroke="#A855F7" stroke-opacity="0.85" stroke-width="1.3" stroke-linejoin="round" />
            <path d="M 55.5 14 L 54.6 7.5 L 60 12.8 Z" fill="#F472B6" fill-opacity="0.85" />

            <!-- Head oval -->
            <ellipse cx="63.5" cy="22.5" rx="10.8" ry="9.4" fill="#080610" stroke="#A855F7" stroke-opacity="0.85" stroke-width="1.4" />

            <!-- Front ear -->
            <path d="M 64 13.5 L 68.5 3 L 72.5 15 Z" fill="#080610" stroke="#A855F7" stroke-opacity="0.85" stroke-width="1.3" stroke-linejoin="round" />
            <path d="M 65.5 13 L 68.2 6.5 L 70.6 14 Z" fill="#F472B6" fill-opacity="0.85" />

            <!-- Glowing golden eyes + pupils + catchlight -->
            <ellipse cx="64.5" cy="22" rx="1.9" ry="2.3" fill="#FDE047" />
            <ellipse cx="70.2" cy="22" rx="1.9" ry="2.3" fill="#FDE047" />
            <ellipse cx="64.7" cy="22" rx="0.6" ry="1.5" fill="#080610" />
            <ellipse cx="70.4" cy="22" rx="0.6" ry="1.5" fill="#080610" />
            <circle cx="64" cy="21.1" r="0.55" fill="#FFFFFF" />
            <circle cx="69.7" cy="21.1" r="0.55" fill="#FFFFFF" />

            <!-- Tiny pink nose & whiskers -->
            <polygon points="72.4,24.8 74,24.8 73.2,26" fill="#F472B6" />
            <path d="M 73.5 25.5 Q 78 24.5 81 25" fill="none" stroke="#C084FC" stroke-opacity="0.65" stroke-width="0.7" />
            <path d="M 73.5 26.8 Q 78 27 80.5 28.2" fill="none" stroke="#C084FC" stroke-opacity="0.65" stroke-width="0.7" />
          </g>
        </g>
